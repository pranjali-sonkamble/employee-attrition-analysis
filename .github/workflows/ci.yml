name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Download public IBM HR dataset
        run: |
          mkdir -p data/raw
          curl -L --fail --retry 3 \
            -o /tmp/employee_attrition.zip \
            https://www.kaggle.com/api/v1/datasets/download/pavansubhasht/ibm-hr-analytics-attrition-dataset
          unzip -o /tmp/employee_attrition.zip -d data/raw
          test -f data/raw/WA_Fn-UseC_-HR-Employee-Attrition.csv

      - name: Run regression tests
        run: python -m pytest -q
